<!DOCTYPE html>
<html lang="nl-BE">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>De aarde bromt</title>
  <!-- Alles staat lokaal: geen internet, geen tracking, geen cookies. -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M4 60 L26 20 L38 20 L60 60 Z' fill='%238a5a3b'/%3E%3Cpath d='M26 20 L38 20 L34 12 L30 12 Z' fill='%23e8572a'/%3E%3C/svg%3E">
</head>
<body>

  <!-- ========== AANMELDEN ========== -->
  <section id="scherm-aanmelden" class="scherm" aria-labelledby="aanmelden-titel">
    <div class="start-prent" id="aanmelden-prent" aria-hidden="true"></div>
    <div class="paneel">
      <h1 id="aanmelden-titel">Wie ben jij?</h1>
      <p id="aanmelden-uitleg">Klik op je naam.</p>
      <div class="namen" id="namen"></div>
      <form class="naam-formulier" id="naam-formulier" hidden>
        <label for="naam-invoer">Je voornaam en de eerste letter van je familienaam</label>
        <input type="text" id="naam-invoer" class="antwoord-kort" autocomplete="off" maxlength="40" placeholder="bv. Noor V.">
        <label for="klas-invoer">Je klas</label>
        <input type="text" id="klas-invoer" class="antwoord-kort" autocomplete="off" maxlength="20" placeholder="bv. 4A">
        <button type="submit" class="knop knop-groot">Aanmelden</button>
      </form>
      <button type="button" class="knop knop-licht knop-klein-tekst" id="knop-leerkracht-aanmelden">Leerkracht</button>
    </div>
  </section>

  <!-- ========== STARTSCHERM ========== -->
  <section id="scherm-start" class="scherm actief" aria-labelledby="start-titel">
    <div class="start-prent" id="start-prent" aria-hidden="true"></div>
    <div class="start-inhoud">
      <h1 id="start-titel">De aarde bromt</h1>
      <p class="ondertitel">Een verhaal over vulkanen en aardbevingen</p>
      <p class="wie" id="wie"></p>
      <div class="start-knoppen">
        <button type="button" class="knop knop-groot" id="knop-start">Start het verhaal</button>
        <button type="button" class="knop knop-groot knop-licht" id="knop-verder" hidden>Verder lezen</button>
        <button type="button" class="knop knop-groot knop-licht" id="knop-hoofdstukken">Hoofdstukken</button>
      </div>
      <div class="start-knoppen klein">
        <button type="button" class="knop knop-licht" id="knop-afmelden">Ik ben iemand anders</button>
        <button type="button" class="knop knop-licht" id="knop-leerkracht">Leerkracht</button>
      </div>
    </div>
  </section>

  <!-- ========== HOOFDSTUKKENOVERZICHT ========== -->
  <section id="scherm-hoofdstukken" class="scherm" aria-labelledby="hoofdstukken-titel">
    <div class="balk">
      <button type="button" class="knop knop-icoon" id="knop-terug-start" aria-label="Terug naar het startscherm" title="Terug naar het startscherm">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11 L12 3 L21 11 M6 9 V21 H18 V9" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <h2 id="hoofdstukken-titel">Hoofdstukken</h2>
      <span class="balk-ruimte"></span>
    </div>
    <ol class="hoofdstukken-lijst" id="hoofdstukken-lijst"></ol>
  </section>

  <!-- ========== VERHAALSCHERM ========== -->
  <section id="scherm-verhaal" class="scherm" aria-labelledby="hoofdstuk-titel">
    <div class="balk">
      <button type="button" class="knop knop-icoon" id="knop-menu" aria-label="Naar de hoofdstukken" title="Naar de hoofdstukken">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6 H20 M4 12 H20 M4 18 H20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
      </button>
      <div class="balk-midden">
        <h2 id="hoofdstuk-titel"></h2>
        <div class="voortgang" id="voortgang" role="img"></div>
      </div>
      <div class="balk-knoppen">
        <button type="button" class="knop knop-icoon" id="knop-voorlezen" aria-pressed="false" aria-label="Lees voor" title="Lees voor">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9 H7 L12 5 V19 L7 15 H3 Z" fill="currentColor"/><path class="golfjes" d="M15.5 9 Q17.5 12 15.5 15 M18 6.5 Q22 12 18 17.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <button type="button" class="knop knop-icoon" id="knop-geluid" aria-pressed="false" aria-label="Geluid staat uit" title="Geluid staat uit">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18 V6 L20 4 V16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/><circle cx="6.5" cy="18" r="2.8" fill="currentColor"/><circle cx="17.5" cy="16" r="2.8" fill="currentColor"/><path class="streep" d="M3 3 L21 21" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
        </button>
        <button type="button" class="knop knop-icoon" id="knop-beweging" aria-pressed="false" aria-label="Minder beweging" title="Minder beweging">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12 Q6 6 10 12 T18 12 T22 12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><path class="streep" d="M3 3 L21 21" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
        </button>
      </div>
    </div>

    <div class="verhaal-inhoud">
      <!-- Waar zitten we in de onderzoekscyclus of de ontwerpcyclus? -->
      <div class="cyclus" id="cyclus" hidden></div>

      <!-- De prent met ontdekplekken -->
      <div class="prent-kader" id="prent-kader">
        <div class="prent" id="prent" aria-hidden="true"></div>
        <div class="ontdekplekken" id="ontdekplekken"></div>
      </div>

      <!-- De verhaaltekst -->
      <div class="tekst" id="tekst" aria-live="polite"></div>

      <!-- Keuzemoment (alleen zichtbaar bij een keuze) -->
      <div class="keuzes" id="keuzes" hidden></div>

      <!-- Opdrachten en evaluaties bij deze scène -->
      <div class="opdrachten" id="opdracht" hidden></div>
    </div>

    <div class="navigatie">
      <button type="button" class="knop knop-nav" id="knop-vorige">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4 L7 12 L15 20" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Vorige
      </button>
      <p class="nog-doen" id="nog-doen" aria-live="polite" hidden></p>
      <button type="button" class="knop knop-nav knop-volgende" id="knop-volgende">
        Volgende
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4 L17 12 L9 20" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </section>

  <!-- ========== LEERKRACHT ========== -->
  <section id="scherm-leerkracht" class="scherm" aria-labelledby="leerkracht-titel">
    <div class="balk">
      <button type="button" class="knop knop-icoon" id="knop-terug-leerkracht" aria-label="Terug" title="Terug">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11 L12 3 L21 11 M6 9 V21 H18 V9" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <h2 id="leerkracht-titel">Voor de leerkracht</h2>
      <span class="balk-ruimte"></span>
    </div>
    <div class="leerkracht-inhoud" id="leerkracht-inhoud"></div>
  </section>

  <!-- ========== KAARTJES (weetje en woordenlijst) ========== -->
  <div class="kaartje-achtergrond" id="kaartje-achtergrond" hidden>
    <div class="kaartje" id="kaartje" role="dialog" aria-modal="true" aria-labelledby="kaartje-titel">
      <h3 id="kaartje-titel"></h3>
      <p id="kaartje-tekst"></p>
      <button type="button" class="knop" id="kaartje-sluiten">Sluiten</button>
    </div>
  </div>

  <!-- Data eerst, daarna de prenten, daarna de code. -->
  <script src="js/instellingen.js"></script>
  <script src="js/klaslijst.js"></script>
  <script src="js/woorden.js"></script>
  <script src="js/feedback.js"></script>
  <script src="js/verhaal.js"></script>
  <script src="assets/figuren.js"></script>
  <script src="assets/hoofdstuk1.js"></script>
  <script src="assets/hoofdstuk2.js"></script>
  <script src="assets/hoofdstuk3.js"></script>
  <script src="assets/hoofdstuk4.js"></script>
  <script src="assets/hoofdstuk5.js"></script>
  <script src="assets/hoofdstuk6.js"></script>
  <script src="assets/hoofdstuk7.js"></script>
  <script src="assets/hoofdstuk8.js"></script>
  <script src="assets/hoofdstuk9.js"></script>
  <script src="assets/hoofdstuk10.js"></script>
  <script src="assets/werkbundel.js"></script>
  <script src="js/resultaten.js"></script>
  <script src="js/opdrachten.js"></script>
  <script src="js/leerkracht.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
